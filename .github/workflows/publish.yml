name: publish otter-pm

# The app is its own package, published from its own repository: a push to main
# runs the tests, and publishes only when package.json carries a version npm
# does not have yet.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: publish when the version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          local_version=$(node -p "require('./package.json').version")
          published=$(npm view "$(node -p "require('./package.json').name")" version 2>/dev/null || echo none)
          if [ "$local_version" = "$published" ]; then
            echo "version $local_version is already published"
            exit 0
          fi
          npm publish --provenance --access public
