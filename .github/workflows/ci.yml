name: otter-pm

# The app is its own package, but it is not published: this runs the tests and the typecheck and stops there.
#
# It runs on a pull request as well as on main. A failing test and a type that no longer compiles are both cheaper to
# find before a merge than after one — and the second one arrives on a branch the moment a dependency brings its own
# types with it, which is how `@types/node` turned `Buffer` into something the DOM's `BodyInit` refuses.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
